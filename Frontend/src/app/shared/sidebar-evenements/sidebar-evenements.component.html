<div class="sidebar-evenements">
  <div class="calendar-section">
    <h4><i class="fas fa-calendar-alt"></i> Calendrier des événements</h4>
    <!-- Utilise un composant calendrier Angular ou une table custom -->
    <ng-container *ngIf="calendarEvents.length; else noEvents">
      <app-mini-calendar
        [events]="calendarEvents"
        (dateSelected)="onDateSelected($event)">
      </app-mini-calendar>
    </ng-container>
    <ng-template #noEvents>
      <div class="no-events">Aucun événement à venir</div>
    </ng-template>
  </div>

  <div class="offres-section">
    <h4><i class="fas fa-bullhorn"></i> Offres & Publications</h4>
    <div *ngIf="offres.length; else noOffres">
      <div class="offre-card" *ngFor="let offre of offres">
        <div class="offre-title">{{ offre.titre }}</div>
        <div class="offre-ecole">{{ offre.ecole }}</div>
        <div class="offre-date">{{ offre.date | date:'dd/MM/yyyy' }}</div>
        <div class="offre-desc">{{ offre.description }}</div>
        <a *ngIf="offre.lien" [href]="offre.lien" target="_blank" class="btn-link">Voir plus</a>
      </div>
    </div>
    <ng-template #noOffres>
      <div class="no-offres">Aucune offre pour le moment</div>
    </ng-template>
  </div>
</div>
