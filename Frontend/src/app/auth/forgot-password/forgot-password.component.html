<app-navbar></app-navbar>
<!-- Page Header -->
<div class="container-fluid page-header py-6 my-6 mt-0 wow fadeIn" data-wow-delay="0.1s">
  <div class="container text-center">
    <h1 class="display-4 text-white animated slideInDown mb-4">Mot de passe oublié</h1>
    <nav aria-label="breadcrumb animated slideInDown">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a class="text-white" routerLink="/">Accueil</a></li>
        <li class="breadcrumb-item text-primary active" aria-current="page">Réinitialisation</li>
      </ol>
    </nav>
  </div>
</div>

<!-- Formulaire -->
<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div *ngIf="!isSubmitted; else successMessage">
      <h2>Réinitialiser votre mot de passe</h2>
      <p>Entrez votre adresse email pour recevoir un lien de réinitialisation</p>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Votre adresse email"
            [class.invalid]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">

          <div *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched" class="error-message">
            <span *ngIf="resetForm.get('email')?.errors?.['required']">Email requis</span>
            <span *ngIf="resetForm.get('email')?.errors?.['email']">Email invalide</span>
          </div>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">Envoyer le lien</span>
          <span *ngIf="isLoading">Envoi en cours...</span>
        </button>
      </form>
    </div>

    <ng-template #successMessage>
      <div class="success-message">
        <h2>Email envoyé!</h2>
        <p>Nous avons envoyé un lien de réinitialisation à votre adresse email.</p>
        <button (click)="goToLogin()" class="btn-login">Retour à la connexion</button>
      </div>
    </ng-template>
  </div>
</div>
<app-footer></app-footer>
