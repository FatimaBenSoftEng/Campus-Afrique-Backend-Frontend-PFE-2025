<!-- ================================
     FORMULAIRE D’HÉBERGEMENT
================================ -->

<div class="app-layout">
  <!-- Sidebar gauche -->
  <app-sidebar-etudiant-fix *ngIf="sidebarVisible"></app-sidebar-etudiant-fix>

  <!-- Contenu principal -->
  <div class="main-content-area">
    <!-- Navbar avec bouton toggle -->
    <app-navbar-etudiant (toggleGauche)="toggleSidebar()"></app-navbar-etudiant>

    <div class="content-wrapper">
     <!-- <nav class="breadcrumb-bar">
        <a class="breadcrumb-item" routerLink="/tableau-de-bord">Tableau de bord</a>
        <span class="breadcrumb-separator">/</span>
        <a class="breadcrumb-item active" routerLink="/formulaire-hebergement">Demande d'Hébergement</a>
      </nav>-->
      <h1 class="page-title">Demande d'Hébergement</h1>

      <form class="hebergement-form" (ngSubmit)="onSubmit(hebergementForm)" #hebergementForm="ngForm" autocomplete="off">
        <!-- Informations générales -->
        <div class="form-section">
          <h3>Informations Personnelles</h3>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Nom</label>
              <input type="text" name="nom" [(ngModel)]="form.nom" disabled />
            </div>

            <div class="form-group">
              <label class="required">Prénom</label>
              <input type="text" name="prenom" [(ngModel)]="form.prenom" disabled />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Email</label>
              <input type="email" name="email" [(ngModel)]="form.email" required />
            </div>

            <div class="form-group">
              <label class="required">Téléphone</label>
              <input type="tel" name="telephone" [(ngModel)]="form.telephone" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Nationalité</label>
              <input type="text" name="nationalite" [(ngModel)]="form.nationalite" disabled />
            </div>

            <div class="form-group">
              <label class="required">Passeport ou Carte d'identité</label>
              <input type="text" name="identite" [(ngModel)]="form.identite" required disabled />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Établissement d’accueil</label>
              <input type="text" name="etablissement" [(ngModel)]="form.etablissement" required />
            </div>

            <div class="form-group">
              <label class="required">Ville du séjour</label>
              <input type="text" name="ville" [(ngModel)]="form.ville" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Date d’arrivée prévue</label>
              <input type="date" name="dateArrivee" [(ngModel)]="form.dateArrivee" required />
            </div>

            <div class="form-group">
              <label class="required">Type d’hébergement souhaité</label>
              <select name="typeHebergement" [(ngModel)]="form.typeHebergement" required>
                <option value="">Sélectionnez un type</option>
                <option value="residence">Résidence universitaire</option>
                <option value="foyer">Foyer</option>
                <option value="colocation">Colocation</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Section documents -->
        <div class="form-section">
          <h3>Documents Requis</h3>

          <p>Veuillez ajouter les documents suivants si disponibles :</p>
          <ul>
            <li>Lettre d’admission</li>
            <li>Pièce d’identité (Passeport ou CIN)</li>
          </ul>

          <!-- Liste des fichiers uploadés -->
          <h5 class="mt-3">Fichiers sélectionnés :</h5>
          <ul *ngIf="documents.length > 0">
            <li *ngFor="let doc of documents">
              {{ doc.name }} <button type="button" (click)="supprimerDocument(doc)">Supprimer</button>
            </li>
          </ul>

          <input type="file" multiple (change)="uploadDocuments($event)" hidden #fileInput />
          <button type="button" class="btn btn-outline-primary" (click)="fileInput.click()">+ Ajouter un document</button>
        </div>

        <!-- Commentaires -->
        <div class="form-section">
          <h3>Commentaires</h3>
          <div class="form-group">
            <textarea name="commentaires" [(ngModel)]="form.commentaires" rows="4" placeholder="Ajoutez des remarques facultatives..."></textarea>
          </div>
        </div>

        <!-- Bouton de soumission -->
        <div class="form-submit-container">
          <button type="submit" class="btn btn-jaune">Envoyer la demande</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Footer -->
  <app-footer-etudiant></app-footer-etudiant>
</div>
