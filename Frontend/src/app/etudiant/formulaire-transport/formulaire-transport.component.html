<!-- ================================
     FORMULAIRE DE TRANSPORT
================================ -->

<div class="app-layout">
  <!-- Sidebar gauche -->
  <app-sidebar-etudiant-fix *ngIf="sidebarVisible"></app-sidebar-etudiant-fix>

  <!-- Contenu principal -->
  <div class="main-content-area">
    <!-- Navbar -->
    <app-navbar-etudiant (toggleGauche)="toggleSidebar()"></app-navbar-etudiant>
    <div class="content-wrapper">
     <!-- <nav class="breadcrumb-bar">
        <a class="breadcrumb-item" routerLink="/tableau-de-bord">Tableau de bord</a>
        <span class="breadcrumb-separator">/</span>
        <a class="breadcrumb-item active" routerLink="/formulaire-transport">Demande de Transport</a>
      </nav>-->

      <h1 class="page-title">Demande de Transport</h1>

      <form class="transport-form" (ngSubmit)="onSubmit(transportForm)" #transportForm="ngForm" autocomplete="off">

        <!-- Section Informations personnelles -->
        <div class="form-section">
          <h3>Informations Personnelles</h3>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Nom</label>
              <input type="text" name="nom" [(ngModel)]="form.nom" disabled />
            </div>

            <div class="form-group">
              <label class="required">Prénom</label>
              <input type="text" name="prenom" [(ngModel)]="form.prenom" disabled />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Nationalité</label>
              <input type="text" name="nationalite" [(ngModel)]="form.nationalite" disabled />
            </div>

            <div class="form-group">
              <label class="required">CIN ou Passeport</label>
              <input type="text" name="identite" [(ngModel)]="form.identite" disabled />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Email</label>
              <input type="email" name="email" [(ngModel)]="form.email" required />
            </div>

            <div class="form-group">
              <label class="required">Téléphone</label>
              <input type="tel" name="telephone" [(ngModel)]="form.telephone" required />
            </div>
          </div>
        </div>

        <!-- Section Transport -->
        <div class="form-section">
          <h3>Informations sur la ville et le transport</h3>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Ville de séjour</label>
              <input type="text" name="ville" [(ngModel)]="form.ville" required />
            </div>

            <div class="form-group">
              <label class="required">Adresse actuelle</label>
              <input type="text" name="adresse" [(ngModel)]="form.adresse" required />
            </div>
          </div>

          <div class="form-group">
            <label class="required">Établissement</label>
            <input type="text" name="etablissement" [(ngModel)]="form.etablissement" required />
          </div>

          <div class="form-group">
            <label class="required">Fréquence des déplacements</label>
            <select name="frequence" [(ngModel)]="form.frequence" required>
              <option value="">-- Sélectionnez --</option>
              <option value="quotidien">Quotidien</option>
              <option value="occasionnel">Occasionnel</option>
            </select>
          </div>

          <div class="form-group">
            <label class="required">Type de transport souhaité</label>
            <select name="typeTransport" [(ngModel)]="form.typeTransport" required>
              <option value="">-- Sélectionnez --</option>
              <option value="bus">Bus</option>
              <option value="tramway">Tramway</option>
              <option value="taxi">Taxi</option>
              <option value="velo">Vélo</option>
              <option value="autre">Autre</option>
            </select>
          </div>

          <div class="form-group">
            <label class="required">Besoin d’un abonnement ?</label>
            <select name="besoinAbonnement" [(ngModel)]="form.besoinAbonnement" required>
              <option value="">-- Sélectionnez --</option>
              <option [ngValue]="true">Oui</option>
              <option [ngValue]="false">Non</option>
            </select>
          </div>
        </div>

        <!-- Section Documents -->
        <div class="form-section">
          <h3>Documents Requis</h3>

          <p>Veuillez ajouter les documents suivants :</p>
          <ul>
            <li>Justificatif d’inscription</li>
            <li>Pièce d’identité (Passeport ou CIN)</li>
          </ul>

          <!-- Liste des fichiers uploadés -->
          <h5 class="mt-3">Fichiers sélectionnés :</h5>
          <ul *ngIf="documents.length > 0">
            <li *ngFor="let doc of documents">
              {{ doc.name }} <button type="button" (click)="supprimerDocument(doc)">Supprimer</button>
            </li>
          </ul>

          <input type="file" multiple (change)="uploadDocuments($event)" hidden #fileInput />
          <button type="button" class="btn btn-outline-primary" (click)="fileInput.click()">+ Ajouter un document</button>
        </div>

        <!-- Commentaires -->
        <div class="form-section">
          <h3>Commentaires</h3>
          <div class="form-group">
            <textarea name="commentaires" [(ngModel)]="form.commentaires" rows="4" placeholder="Ajoutez des remarques facultatives..."></textarea>
          </div>
        </div>

        <!-- Bouton de soumission -->
        <div class="form-submit-container">
          <button type="submit" class="btn btn-jaune">Envoyer la demande</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Footer -->
  <app-footer-etudiant></app-footer-etudiant>
</div>
