<div class="app-layout">
  <!-- Sidebar gauche -->
  <app-sidebar-etudiant-fix *ngIf="sidebarVisible"></app-sidebar-etudiant-fix>

  <!-- Contenu principal -->
  <div class="main-content-area">
    <!-- Navbar avec bouton toggle -->
    <app-navbar-etudiant (toggleGauche)="toggleSidebar()"></app-navbar-etudiant>

    <div class="content-wrapper">
      <!--<nav class="breadcrumb-bar">
        <a class="breadcrumb-item" routerLink="/etudiant/tableau-de-bord">Tableau de bord</a>
        <span class="breadcrumb-separator">/</span>
        <a class="breadcrumb-item active" routerLink="/etudiant/profil">Mon Profil</a>
      </nav>-->
      <h1 class="page-title">Mon Profil</h1>

      <form #profilForm="ngForm" (ngSubmit)="onSubmit(profilForm)" autocomplete="off" class="profil-form">

        <!-- Bloc de photo de profil affichée au-dessus -->
        <div class="profile-header">
          <div class="profile-image-container">
            <img [src]="photoPreview" alt="Photo de profil" class="profile-image" />
          </div>

          <div class="form-group mt-3">
            <label >Nouvelle image</label>
            <input type="file" id="profilePhoto" (change)="onPhotoChange($event)" accept="image/*">
          </div>
        </div>

        <!-- Section Informations personnelles -->
        <div class="form-section">
          <h3>Informations personnelles</h3>

          <div class="form-row">
            <div class="form-group">
              <label class="required">Nom</label>
              <input type="text" name="nom" [(ngModel)]="form.nom" required>
            </div>

            <div class="form-group">
              <label class="required">Prénom</label>
              <input type="text" name="prenom" [(ngModel)]="form.prenom" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Genre</label>
              <select name="genre" [(ngModel)]="form.genre">
                <option value="">Sélectionnez</option>
                <option value="Homme">Homme</option>
                <option value="Femme">Femme</option>
                <option value="Autre">Autre</option>
              </select>
            </div>

            <div class="form-group">
              <label>Date de naissance</label>
              <input type="date" name="dateNaissance" [(ngModel)]="form.dateNaissance">
            </div>
          </div>

          <div class="form-group">
            <label>Nationalité</label>
            <input type="text" name="nationalite" [(ngModel)]="form.nationalite">
          </div>

          <div class="form-group">
            <label>Pays de résidence</label>
            <input type="text" name="paysOrigine" [(ngModel)]="form.paysOrigine">
          </div>

          <div class="form-group">
            <label>Adresse complète</label>
            <input type="text" name="adresse" [(ngModel)]="form.adresse">
          </div>

          <div class="form-group">
            <label class="required">Email</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="form.email"
              required
              email
              #emailRef="ngModel"
            >
            <div *ngIf="emailRef.invalid && emailRef.touched" class="error-message">
              <span *ngIf="emailRef.errors?.['required']">L'email est requis.</span>
              <span *ngIf="emailRef.errors?.['email']">Email invalide.</span>
            </div>
          </div>

          <div class="form-group">
            <label>Téléphone</label>
            <input
              type="tel"
              name="telephone"
              [(ngModel)]="form.telephone"
              pattern="[0-9]{8,15}"
              #telRef="ngModel"
            >
            <div *ngIf="telRef.invalid && telRef.touched" class="error-message">
              <span *ngIf="telRef.errors?.['pattern']">Téléphone invalide (8 à 15 chiffres).</span>
            </div>
          </div>
        </div>

        <!-- Section Informations académiques -->
        <div class="form-section">
          <h3>Informations académiques</h3>

          <div class="form-group">
            <label>Dernier diplôme obtenu</label>
            <input type="text" name="dernierDiplome" [(ngModel)]="form.dernierDiplome">
          </div>

          <div class="form-group">
            <label>Spécialité</label>
            <input type="text" name="specialite" [(ngModel)]="form.specialite">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Année d’obtention</label>
              <input type="date" name="anneeObtention" [(ngModel)]="form.anneeObtention">
            </div>

            <div class="form-group">
              <label>Moyenne générale</label>
              <input type="number" step="0.01" name="moyenne" [(ngModel)]="form.moyenne">
            </div>
          </div>
        </div>

        <!-- Bouton de soumission -->
        <div class="form-actions">
          <div class="form-submit-container">
            <button type="submit" class="btn btn-jaune">Enregistrer mes informations</button>
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- Footer -->
  <app-footer-etudiant></app-footer-etudiant>
</div>
