<!-- Sidebar gauche -->
<app-slidebar-etablissement-fix *ngIf="sidebarVisible"></app-slidebar-etablissement-fix>

<!-- Contenu principal -->
<div class="main-content-area" style="margin-top: 0 !important; padding-top: 0 !important;">

  <!-- Navbar -->
  <app-navbar-etablissement (toggleGauche)="toggleSidebar()"></app-navbar-etablissement>
  <div class="content-wrapper">

    <!-- Titre et bouton -->
    <div class="table-header">
      <h1 class="page-title">Revue de la formation</h1>
      <div class="form-actions">
        <div class="form-submit-container">
          <button type="submit" class="btn btn-jaune " [routerLink]="['/ajouter-formation']">
            <i class="fa fa-plus"></i> Ajouter Formation
          </button>
        </div>
      </div>
    </div>
    <!-- Section du tableau avec arrière-plan blanc -->
    <div class="table-section">
      <!-- Contrôles du tableau : Show entries et Search -->
      <div class="table-controls">
        <div class="show-entries">
          <label>
            Show
            <select class="entries-select">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            entries
          </label>
        </div>
        <div class="search-container">
          <label>
            Search:
            <input type="text" class="search-input" placeholder="">
          </label>
        </div>
      </div>
      <!-- Tableau -->
      <table class="etat-demande-table">
        <thead>
        <tr>
          <th>Id</th>
          <th>Nom de la formation</th>
          <th>Review</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let formation of reviews">
          <td>{{ formation.id }}</td>
          <td><a href="#" class="link">{{ formation.nom }}</a></td>
          <td>{{ formation.review }}</td>
          <td>
      <span class="etat-badge"
            [ngClass]="formation.statut === 'Active' ? 'validee' : 'en_attente'">
        {{ formation.statut }}
      </span>
          </td>
          <td>
            <!-- Supprimer -->
            <button class="action-icon delete" title="Supprimer">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>
      <!-- Pagination -->
      <div class="table-pagination">
        <div class="pagination-info">
          Showing 1 to 2 of 2 entries
        </div>
        <div class="pagination-controls">
          <button class="pagination-btn" disabled>Previous</button>
          <button class="pagination-btn active">1</button>
          <button class="pagination-btn" disabled>Next</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<app-footer-etablissement></app-footer-etablissement>
